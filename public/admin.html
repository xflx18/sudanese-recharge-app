<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم السودان شحن</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        padding-bottom: 40px;
      }
      .admin-shell {
        max-width: 1200px;
        margin: 48px auto 0;
        padding: 0 18px;
      }
      .topbar-admin {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(17, 23, 35, 0.9);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px 22px;
        margin-bottom: 28px;
      }
      .admin-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 26px;
      }
      .stat-box {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px;
      }
      .stat-box h4 {
        color: var(--muted);
        font-size: 0.95rem;
        margin-bottom: 8px;
      }
      .stat-box strong {
        font-size: clamp(1.5rem, 3vw, 2.4rem);
      }
      .orders-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
      }
      .orders-table th,
      .orders-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        text-align: right;
        vertical-align: top;
      }
      .orders-table th {
        background: rgba(255,255,255,0.03);
      }
      .status-pill {
        display: inline-flex;
        padding: 0.35rem 0.75rem;
        border-radius: 999px;
        border: 1px solid rgb(74, 222, 128, 0.25);
        background: rgba(74, 222, 128, 0.08);
        color: #b7f7d3;
      }
      .empty-state {
        padding: 26px;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .orders-table {
          display: block;
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <div class="topbar-admin">
        <div class="brand">
          <div class="brand-mark">S</div>
          <span>لوحة تحكم Sudan Shion</span>
        </div>
        <a href="/" class="primary-btn">عودة للواجهة</a>
      </div>

      <div class="admin-grid">
        <div class="stat-box">
          <h4>إجمالي الطلبات</h4>
          <strong id="totalOrders">0</strong>
        </div>
        <div class="stat-box">
          <h4>طلبات اليوم</h4>
          <strong id="todayOrders">0</strong>
        </div>
        <div class="stat-box">
          <h4>مجموع المبالغ</h4>
          <strong id="totalRevenue">0</strong>
        </div>
      </div>

      <table class="orders-table">
        <thead>
          <tr>
            <th>رقم الطلب</th>
            <th>الاسم</th>
            <th>الهاتف</th>
            <th>الخدمة</th>
            <th>المبلغ</th>
            <th>الدفع</th>
            <th>الحالة</th>
            <th>التاريخ</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
